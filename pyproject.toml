[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoops-navigator"
version = "0.1.0"
description = "Explainable decision-support prototype that prioritises digital and physical operational-efficiency opportunities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - hackathon prototype" }
authors = [{ name = "Madhur Mishra" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.18"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
ecoops = "ecoops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecoops.defaults" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B023"]
